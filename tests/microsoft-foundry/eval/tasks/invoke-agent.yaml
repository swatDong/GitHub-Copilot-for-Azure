id: invoke-agent-001
name: "Invoke Agent"
description: >
  Verifies the skill routes to the invoke sub-skill when asked
  to send a message to an existing Foundry agent.
tags:
  - invoke
  - happy-path

inputs:
  prompt: "Send a message to my Foundry agent"

expected:
  output_contains:
    - "invoke"
  output_not_contains:
    - "deploy"
    - "create"
  behavior:
    max_tool_calls: 10
